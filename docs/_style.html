<style>
  :root { --accent: #2563eb; --muted: #64748b; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color: #1e293b; line-height: 1.65; max-width: 46rem; margin: 0 auto;
         padding: 2.5rem 1.5rem 4rem; }
  header#title-block-header h1.title { font-size: 1.9rem; margin: 0 0 .25rem; }
  h1 { font-size: 1.9rem; border-bottom: 3px solid var(--accent);
       padding-bottom: .4rem; margin-top: 0; }
  h2 { font-size: 1.35rem; margin-top: 2.2rem; border-bottom: 1px solid var(--border);
       padding-bottom: .25rem; }
  h3 { font-size: 1.1rem; margin-top: 1.6rem; }
  p > em:first-child { color: var(--muted); }
  a { color: var(--accent); }
  code { background: #f1f5f9; border-radius: 4px; padding: .1em .35em;
         font-size: .9em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .95rem; }
  th, td { border: 1px solid var(--border); padding: .5rem .7rem; text-align: left;
           vertical-align: top; }
  th { background: #f8fafc; }
  li { margin: .25rem 0; }
  blockquote { border-left: 4px solid var(--accent); margin: 1rem 0;
               padding: .25rem 1rem; color: var(--muted); }
  @media print {
    body { max-width: none; padding: 0; font-size: 11pt; }
    a { color: inherit; text-decoration: none; }
    h2 { page-break-after: avoid; }
    table, li { page-break-inside: avoid; }
  }
</style>
